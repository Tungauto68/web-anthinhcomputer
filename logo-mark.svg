<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="atg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FA9F5"/>
      <stop offset="1" stop-color="#1557D6"/>
    </linearGradient>
    <linearGradient id="atd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1557D6"/>
      <stop offset="1" stop-color="#0B2A5B"/>
    </linearGradient>
    <clipPath id="atl"><rect x="0" y="0" width="100" height="200"/></clipPath>
  </defs>
  <!-- half gear (left) -->
  <g clip-path="url(#atl)" fill="url(#atg)">
    <path fill-rule="evenodd" d="M100 22a78 78 0 1 0 0 156a78 78 0 1 0 0-156zm0 14a64 64 0 1 1 0 128a64 64 0 1 1 0-128z"/>
    <g>
      <rect x="91" y="8" width="18" height="20" rx="3" transform="rotate(-30 100 100)"/>
      <rect x="91" y="8" width="18" height="20" rx="3" transform="rotate(-60 100 100)"/>
      <rect x="91" y="8" width="18" height="20" rx="3" transform="rotate(-90 100 100)"/>
      <rect x="91" y="8" width="18" height="20" rx="3" transform="rotate(-120 100 100)"/>
      <rect x="91" y="8" width="18" height="20" rx="3" transform="rotate(-150 100 100)"/>
    </g>
  </g>
  <!-- circuit traces (right) -->
  <g fill="none" stroke="url(#atg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 54 L140 30 H150"/>
    <path d="M140 66 L158 48 H170"/>
    <path d="M140 134 L158 152 H170"/>
    <path d="M120 146 L140 170 H150"/>
  </g>
  <g fill="#fff" stroke="url(#atg)" stroke-width="5">
    <circle cx="156" cy="30" r="7"/>
    <circle cx="176" cy="48" r="7"/>
    <circle cx="176" cy="152" r="7"/>
    <circle cx="156" cy="170" r="7"/>
  </g>
  <!-- core disk -->
  <circle cx="100" cy="100" r="52" fill="url(#atd)"/>
  <!-- letter A with crossbar running out as a trace -->
  <path d="M78 134 L100 68 L122 134" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88 112 H184" fill="none" stroke="#3FA9F5" stroke-width="8" stroke-linecap="round"/>
  <circle cx="189" cy="112" r="8" fill="#fff" stroke="#3FA9F5" stroke-width="5"/>
</svg>
